<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Admin Login — DMsgBox</title>
  <meta name="robots" content="noindex,nofollow" />
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.105.0/dist/umd/supabase.js" integrity="sha384-OMZvx3Vy2g+m2/bV7wq4vKCSjS3P2+OVcOXSaqWaoK3ZoSAHaje1LSM9FK4MNk2J" crossorigin="anonymous"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <style>
    * { box-sizing: border-box; }
    body {
      display: grid; place-items: center; min-height: 100vh; margin: 0; padding: 24px 20px;
      font-family: 'Plus Jakarta Sans', system-ui, sans-serif; background: #0f172a; color: #f1f5f9;
    }
    .page { width: min(100%, 380px); }
    .brand, .back { text-align: center; }
    .brand { margin-bottom: 24px; }
    .brand a { font-size: 24px; font-weight: 700; color: white; text-decoration: none; }
    .brand span { color: #2dd4bf; }
    .brand p, .back { color: #a7b6ca; font-size: 14px; }
    .back { margin: 24px 0 0; }
    .back a { color: inherit; }
    .card { padding: 24px; border: 1px solid #334155; border-radius: 8px; background: #1e293b; }
    h1 { margin: 0 0 20px; font-size: 21px; }
    p { line-height: 1.5; }
    form, .stack { display: grid; gap: 16px; }
    .stack p { margin: 0; color: #d5dfec; font-size: 14px; }
    label { display: block; margin-bottom: 8px; font-size: 14px; font-weight: 600; }
    input {
      width: 100%; min-width: 0; padding: 12px; border: 1px solid #53637b; border-radius: 6px;
      background: #0f172a; color: white; font: inherit;
    }
    button {
      width: 100%; min-height: 44px; padding: 10px 12px; border: 0; border-radius: 6px;
      color: #061914; background: #46d6b8; font: inherit; font-weight: 700; cursor: pointer;
    }
    button:hover { background: #6ee7cc; }
    button:disabled { cursor: wait; opacity: .65; }
    #mfa-sign-out { width: fit-content; color: #d5dfec; background: transparent; text-decoration: underline; }
    :focus-visible { outline: 2px solid #2dd4bf; outline-offset: 3px; }
    #mfa-qr { display: block; width: min(100%, 192px); height: auto; margin: auto; padding: 8px; background: white; border-radius: 6px; }
    #mfa-qr:not([src]) { display: none; }
    details { color: #d5dfec; font-size: 14px; }
    summary { cursor: pointer; }
    #mfa-secret { display: block; margin-top: 8px; color: #99f6e4; overflow-wrap: anywhere; }
    #login-error { margin: 16px 0 0; color: #fecaca; background: #472631; border-radius: 6px; padding: 12px; font-size: 14px; }
    .hidden { display: none; }
  </style>
</head>
<body>

  <main class="page">

    <!-- Logo -->
    <header class="brand">
      <a href="index.html">
        DMsg<span>Box</span>
      </a>
      <p id="console-name">Blog Admin Console</p>
    </header>

    <!-- Admin sign-in -->
    <section class="card">
      <h1 id="login-heading">Sign in</h1>

      <form id="login-form" novalidate>
        <div>
          <label for="email">Email</label>
          <input
            id="email"
            type="email"
            autocomplete="email"
            required
            placeholder="admin@dmsgbox.com"
          />
        </div>
        <div>
          <label for="password">Password</label>
          <input
            id="password"
            type="password"
            autocomplete="current-password"
            required
            placeholder="••••••••"
          />
        </div>

        <button
          type="submit"
          id="login-btn"
        >
          Sign In
        </button>
      </form>
      <div id="mfa-panel" class="hidden stack">
        <div id="mfa-start" class="hidden stack">
          <p>Set up an authenticator app to protect your administrator account.</p>
          <button id="mfa-enroll" type="button">Set up authenticator</button>
        </div>
        <form id="mfa-form" class="hidden">
          <div id="mfa-setup" class="hidden stack">
            <p>Scan this QR code with your authenticator app.</p>
            <img id="mfa-qr" alt="Authenticator setup QR code" width="192" height="192" />
            <details>
              <summary>Enter setup key manually</summary>
              <code id="mfa-secret"></code>
            </details>
          </div>
          <div>
            <label for="mfa-code">Authenticator code</label>
            <input id="mfa-code" type="text" inputmode="numeric" autocomplete="one-time-code" pattern="[0-9]{6}" maxlength="6" required />
          </div>
          <button id="mfa-verify" type="submit">Verify and continue</button>
        </form>
        <button id="mfa-sign-out" type="button">Sign out</button>
      </div>
      <p id="login-error" class="hidden" role="alert"></p>
    </section>

    <p class="back">
      <a href="index.html">&larr; Back to website</a>
    </p>
  </main>

  <script>
    const SUPABASE_URL      = 'https://bjpwckpmktnwtdzpmnvn.supabase.co';

  </script>
  <script src="../js/dmb-admin-mfa.js"></script>
</body>
</html>
